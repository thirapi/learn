[package]
name = "learn"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "learn"
path = "src/main.rs"

[dependencies]
rune = { path = "../rune/crates/rune" }
rune-kit = { path = "../rune/crates/rune-kit", features = ["markdown", "mermaid"] }
rune-theme-opencode = { path = "../rune/themes/opencode" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[patch.crates-io]
wgpu-hal = { path = "../rune/vendor/wgpu-hal" }
winit = { path = "../rune/vendor/winit" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
